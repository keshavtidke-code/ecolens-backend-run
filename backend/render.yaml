services:
  - type: web
    name: ecolens-api
    runtime: python
    region: oregon          # free-tier region
    plan: free
    rootDir: backend        # Render runs commands relative to this folder

    buildCommand: pip install -r requirements.txt

    # Tables already created via Supabase SQL Editor (schema v0003).
    # alembic upgrade head will detect version 0003 and skip — safe to keep.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Health-check so Render knows when the instance is ready.
    healthCheckPath: /health

    envVars:
      # --- App ---
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1

      # --- Database ---
      # Use Transaction Pooler URL (port 6543, IPv4) — NOT the direct connection (IPv6).
      # Format: postgresql://postgres.[ref]:[PASSWORD]@aws-0-<region>.pooler.supabase.com:6543/postgres
      # Get from: Supabase → Settings → Database → Connection string → Transaction pooler → URI
      - key: DATABASE_URL
        sync: false          # set this secret in the Render dashboard

      # --- Storage ---
      # /tmp is available on free tier but is ephemeral (cleared on restart).
      - key: STORAGE_DIR
        value: /tmp/ecolens-storage
      - key: MAX_UPLOAD_MB
        value: "10"

      # --- CORS (add your frontend/mobile app URL here) ---
      - key: CORS_ORIGINS
        value: "http://localhost:8081,http://localhost:19006,http://localhost:3000,http://10.0.2.2:8081,http://10.0.2.2:19006"
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"

      # --- Logging ---
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json           # structured logs are better on Render

      # --- Gemini AI (set as secret in Render dashboard) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_S
        value: "60"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: ANALYSIS_STALE_AFTER_S
        value: "300"
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.5"

      # --- Weather / Geocoding (no API key needed) ---
      - key: EXTERNAL_LOOKUPS_ENABLED
        value: "true"
      - key: PROVIDER_TIMEOUT_S
        value: "15"
      - key: GEOCODING_USER_AGENT
        value: "EcoLens/0.1 (ecolens-dev@localhost.local)"
      - key: GEOCODING_MIN_INTERVAL_S
        value: "1.0"
      - key: GEOCODING_CACHE_TTL_S
        value: "86400"
      - key: WEATHER_CACHE_TTL_S
        value: "600"

      # --- Chat ---
      - key: CHAT_HISTORY_MESSAGES
        value: "10"
      - key: CHAT_MAX_ATTEMPTS
        value: "3"
      - key: CHAT_RETRY_BACKOFF_S
        value: "0.5"
      - key: CHAT_REQUEST_TIMEOUT_S
        value: "25"
      - key: CHAT_TOTAL_TIMEOUT_S
        value: "50"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CHAT_RATE_LIMIT_PER_HOUR
        value: "100"

      # --- Supabase Auth (set as secrets in Render dashboard) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
