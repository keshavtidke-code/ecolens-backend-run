services:
  - type: web
    name: ecolens-api
    runtime: python
    region: oregon          # free-tier region
    plan: free
    rootDir: backend        # Render runs commands relative to this folder

    buildCommand: pip install -r requirements.txt

    # Render sets PORT automatically; uvicorn must bind to it.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Health-check so Render knows when the instance is ready.
    healthCheckPath: /health

    envVars:
      # --- App ---
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1

      # --- Database (Supabase PostgreSQL â€” persistent & free) ---
      # Get this from: Supabase dashboard â†’ Project Settings â†’ Database â†’ Connection string â†’ URI
      # Format: postgresql://postgres:[PASSWORD]@db.[PROJECT_REF].supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false          # set this secret in the Render dashboard

      # --- Storage ---
      # /tmp is available on free tier but is ephemeral (cleared on restart).
      # For persistent image storage use Supabase Storage (see README).
      - key: STORAGE_DIR
        value: /tmp/ecolens-storage

      # --- Security (set these as secrets in Render dashboard) ---
      - key: SECRET_KEY
        sync: false          # prompts you to set it in the Render dashboard
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # --- CORS (add your frontend URL once deployed) ---
      - key: CORS_ORIGINS
        value: "http://localhost:8081,http://localhost:19006,http://localhost:3000"

      # --- Logging ---
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json           # structured logs are better on Render

      # --- Gemini AI (set as secret in Render dashboard) ---
      - key: GEMINI_API_KEY
        sync: false           # prompts you to set it in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_S
        value: "60"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "8192"

      # --- Weather / Geocoding (no API key needed) ---
      - key: EXTERNAL_LOOKUPS_ENABLED
        value: "true"
      - key: PROVIDER_TIMEOUT_S
        value: "15"
      - key: GEOCODING_USER_AGENT
        value: "EcoLens/0.1 (ecolens-dev@localhost.local)"

      # --- Supabase (set as secrets in Render dashboard) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

